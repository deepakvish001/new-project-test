name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ladder:
    name: packages/ladder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace=@bakaya/ladder
      - name: Test with coverage thresholds
        run: npm run coverage --workspace=@bakaya/ladder

  schema:
    name: db/schema.sql
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Schema applies cleanly
        run: psql -v ON_ERROR_STOP=1 -f db/schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
